<h1>{{ title }}</h1>

<button [disabled]="isDisabled" (click)="onClick()">Toggle</button>

<h1>Count: {{ count() }}</h1>
<h1>Double: {{ doubleCount() }}</h1>
<!-- <h1>Double: {{ getDoubleCount() }}</h1> -->

<button (click)="increateCounter()">+</button>
<button (click)="decreateCounter()">-</button>
<button (click)="resetCounter()">Reset</button>
