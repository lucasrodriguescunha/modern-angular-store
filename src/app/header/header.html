<mat-toolbar class="main-header">
  <button matIconButton aria-label="Store home">
    <mat-icon fontIcon="store"></mat-icon>
  </button>

  <span class="branding">Modern Angular Store</span>
  <span class="spacer"></span>

  <button matIconButton [attr.aria-label]="cartLabel()" (click)="openCart()">
    <mat-icon
      [matBadge]="cartService.totalItems()"
      [matBadgeHidden]="cartService.totalItems() === 0"
      fontIcon="shopping_cart"
    ></mat-icon>
  </button>
</mat-toolbar>
